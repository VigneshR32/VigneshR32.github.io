<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title></title>

  <style>
    .phone-link {
      cursor: default;
      text-decoration: none;
      color: inherit;
    }
    .phone-link.callable {
      cursor: pointer;
      color: #0066cc;
      text-decoration: underline;
    }
    .phone-link.callable:hover {
      opacity: 0.8;
    }
  </style>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R7YW3H4E4V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R7YW3H4E4V');
  </script>
</head>

<body>
  <h1><u>ContactMe</u></h1>
  <ul>
    <li>Mobile No - <a href="tel:+919600136013" class="phone-link" id="phoneLink">+91-960XXXXX13</a></li>
    <li>Mail - hello@vigneshr.xyz</li>
  </ul>

  <script>
    // Detect if device supports calling
    function isCallableDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // Get phone link element
    const phoneLink = document.getElementById('phoneLink');

    if (isCallableDevice()) {
      // On calling devices, enable the link
      phoneLink.classList.add('callable');

      // Track phone call click
      phoneLink.addEventListener('click', function() {
        gtag('event', 'phone_call_click', {
          'device_type': 'mobile',
          'phone_masked': '+91-960XXXXX13'
        });
      });
    } else {
      // On non-calling devices, prevent the link
      phoneLink.style.cursor = 'default';
      phoneLink.style.textDecoration = 'none';
      phoneLink.style.color = 'inherit';

      phoneLink.addEventListener('click', function(e) {
        e.preventDefault();
      });
    }

    // Track email link click
    const emailLink = document.querySelector('a[href^="mailto:"]');
    if (emailLink) {
      emailLink.addEventListener('click', function() {
        gtag('event', 'email_click', {
          'email_masked': 'vignesh****@gmail.com',
          'action': 'open_email_client'
        });
      });
    }

    // Track page visit
    gtag('event', 'page_view', {
      'page_title': 'Contact Me',
      'page_location': window.location.href
    });
  </script>
</body>

</html>
